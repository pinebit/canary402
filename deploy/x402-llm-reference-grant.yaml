# This grant allows only the public Agent route to reference the shared x402
# verifier and skill services. The filename and resource name are retained to
# update the previously deployed v0.13 workaround in place.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: canary402-llm-x402-backends
  namespace: x402
  labels:
    app.kubernetes.io/name: canary402
    app.kubernetes.io/component: routing-workaround
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: agent-canary402
  to:
    - group: ""
      kind: Service
      name: x402-verifier
    - group: ""
      kind: Service
      name: obol-skill-md
